name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-bincache
          key: vcpkg-x86-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x86-windows-static-

      - name: Configure CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            "-DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static `
            -DCMAKE_CXX_STANDARD=17

      - name: Build
        run: cmake --build build --config Release

      - name: Collect output DLLs
        run: |
          New-Item -ItemType Directory -Force -Path artifact\mods | Out-Null
          Copy-Item build\bin\Release\*.dll artifact\
          Copy-Item build\bin\mods\Release\*.dll artifact\mods\
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeatSignatureModLoader
          path: artifact\
          if-no-files-found: error

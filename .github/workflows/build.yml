name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite

    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg-bincache
          key: vcpkg-x86-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x86-windows-static-

      - name: Configure CMake
        run: |
          cmake -B build `
            -A Win32 `
            "-DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static `
            -DCMAKE_CXX_STANDARD=17

      - name: Save vcpkg binary packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg-bincache
          key: vcpkg-x86-windows-static-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect output DLLs
        run: |
          New-Item -ItemType Directory -Force -Path artifact\loader | Out-Null
          foreach ($dll in Get-ChildItem build\bin\mods\Release\*.dll) {
            New-Item -ItemType Directory -Force -Path "artifact\mods\$($dll.BaseName)" | Out-Null
            Copy-Item $dll.FullName "artifact\mods\$($dll.BaseName)\"
          }
          Copy-Item build\bin\Release\*.dll artifact\loader\
        shell: pwsh

      - name: Upload loader artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeatSignatureModLoader
          path: artifact\loader\
          if-no-files-found: error

      - name: Upload DiscordRichPresence artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordRichPresence
          path: artifact\mods\DiscordRichPresence\
          if-no-files-found: warn

      - name: Upload HS_QOL artifact
        uses: actions/upload-artifact@v4
        with:
          name: HS_QOL
          path: artifact\mods\HS_QOL\
          if-no-files-found: warn

      - name: Upload ScreenRecorder artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder
          path: artifact\mods\ScreenRecorder\
          if-no-files-found: warn
